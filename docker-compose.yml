version: '3.8'

# Common configuration for Airflow services to ensure consistency and reduce duplication
x-airflow-common: &airflow-common
  image: apache/airflow:2.8.1-python3.10
  environment:
    - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${PG_USER}:${PG_PASSWORD}@postgres-airflow:5432/${AF_DB}
    - AIRFLOW__CORE__FERNET_KEY=${FERNET_KEY}
    - AIRFLOW__CORE__LOAD_EXAMPLES=False
    # Connection string for the internal Data Warehouse
    - DB_DW_CONN=postgresql://?host=postgres-dw&port=5432&dbname=${DW_DB}&user=${DW_USER}&password=${DW_PASSWORD}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./dbt:/opt/airflow/dbt  # Mounting dbt project for direct execution by Airflow
    - ./logs:/opt/airflow/logs
  networks:
    - iso_compliance_network
  depends_on:
    - postgres-airflow

services:
  # Internal Metadata Database for Apache Airflow
  postgres-airflow:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=${PG_USER}
      - POSTGRES_PASSWORD=${PG_PASSWORD}
      - POSTGRES_DB=${AF_DB}
    networks:
      - iso_compliance_network
    volumes:
      - airflow_metadata_data:/var/lib/postgresql/data

  # The Laboratory Data Warehouse (OLAP)
  # Separated to ensure audit trail integrity and prevent resource contention
  postgres-dw:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=${DW_USER}
      - POSTGRES_PASSWORD=${DW_PASSWORD}
      - POSTGRES_DB=${DW_DB}
    ports:
      - "5433:5432" # Alternative port to avoid local environment conflicts
    networks:
      - iso_compliance_network
    volumes:
      - lab_dw_data:/var/lib/postgresql/data

  # Airflow Webserver: UI for monitoring DAGs and compliance logs
  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Airflow Scheduler: Manages the execution of E-L and dbt transformation tasks
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler

  # Metabase: BI and Automated Audit Dashboard
  metabase:
    image: metabase/metabase:latest
    ports:
      - "3000:3000"
    environment:
      - MB_DB_TYPE=postgres
      - MB_DB_DBNAME=metabase
      - MB_DB_PORT=5432
      - MB_DB_USER=${MB_USER}
      - MB_DB_PASS=${MB_PASS}
      - MB_DB_HOST=postgres-dw # Storing Metabase config in the DW for simplicity
    networks:
      - iso_compliance_network
    depends_on:
      - postgres-dw

networks:
  iso_compliance_network:
    driver: bridge

volumes:
  airflow_metadata_data:
  lab_dw_data:
